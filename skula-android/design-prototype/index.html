if(a==='changes'){modal(el,'Od ostatniego wejścia','<b>Nowa ocena:</b> matematyka, 5.<br><br><b>Nowa wiadomość:</b> zebranie rodziców.<br><br><b>Nowe ogłoszenie:</b> Dzień Edukacji Narodowej.');return}
if(a==='announcement'){modal(el,'Dzień Edukacji Narodowej','Przykładowe ogłoszenie o organizacji zajęć 14 października. Treść pobranego ogłoszenia i jego archiwum pozostają dostępne.');return}
if(a==='search'){modal(el,'Szukaj w szkole','W prototypie działa wyszukiwanie nagłówków wiadomości. W docelowej aplikacji ten skrót prowadzi do istniejącej wyszukiwarki wszystkich sekcji.',button('Przejdź do wiadomości','search-mail','primary'));return}

document.addEventListener('input',e=>{if(!e.target.matches('[data-search]'))return;let el=e.target.closest('[data-device]');deviceState[el.dataset.device].query=e.target.value;let start=e.target.selectionStart;rerenderDevice(el);let input=el.querySelector('[data-search]');input.focus();input.setSelectionRange(start,start)});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable="true"]'))return;if(e.key==='Escape')document.querySelectorAll('.sheet-overlay').forEach(x=>x.remove())});
